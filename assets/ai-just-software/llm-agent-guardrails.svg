<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-label="The LLM proposes. Code and people decide."><style>
  .bg{fill:#ffffff}
  .ink{fill:#1f1f1f}
  .quiet{fill:#666666}
  .box{fill:none;stroke:#b9b6ab;stroke-width:1.25}
  .tint{fill:#f1efe8;stroke:#b9b6ab;stroke-width:1.25}
  .acc{fill:#2f6fd6;fill-opacity:.12;stroke:#2f6fd6;stroke-width:2}
  .line{fill:none;stroke:#b9b6ab;stroke-width:1.25}
  .accline{fill:none;stroke:#2f6fd6;stroke-width:1.25}
  .arrowhead{fill:#b9b6ab}
  .grid{stroke:#e2e0d8;stroke-width:1}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
  .t{font-size:15px;font-weight:600}
  .h{font-size:14px;font-weight:600}
  .b{font-weight:600}
  .s{font-size:11.5px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1b1b1b}
    .ink{fill:#ececec}
    .quiet{fill:#a8a8a8}
    .box,.line{stroke:#6b6b6b}
    .tint{fill:#2a2a2a;stroke:#6b6b6b}
    .acc{fill:#6aa0ff;stroke:#6aa0ff;fill-opacity:.16}
    .accline{stroke:#6aa0ff}
    .arrowhead{fill:#6b6b6b}
    .grid{stroke:#333333}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" x="0" y="0" width="760" height="496" rx="12"/><text class="ink t" x="24" y="34">The LLM proposes. Code and people decide.</text><path class="line" d="M192 110H240" marker-end="url(#arrow)"/><path class="line" d="M440 110H468" marker-end="url(#arrow)"/><path class="line" d="M584 138V180" marker-end="url(#arrow)"/><path class="line" d="M512 216H420" marker-end="url(#arrow)"/><path class="line" d="M584 252V302" marker-end="url(#arrow)"/><path class="line" d="M340 244V330H468" marker-end="url(#arrow)"/><path class="line" d="M584 358V412" marker-end="url(#arrow)"/><path class="line" d="M468 440H248V138" marker-end="url(#arrow)" stroke-dasharray="4 4"/><rect class="box" x="32.0" y="82" width="160" height="56" rx="8"/><text class="ink b" x="112" y="114" text-anchor="middle">Customer message</text><rect class="box" x="240.0" y="82" width="200" height="56" rx="8"/><text class="ink b" x="340" y="106" text-anchor="middle">LLM agent</text><text class="quiet s" x="340" y="124" text-anchor="middle">proposes a reply or action</text><rect class="acc" x="468.0" y="82" width="232" height="56" rx="8"/><text class="ink b" x="584" y="106" text-anchor="middle">Guardrail in code</text><text class="ink s" x="584" y="124" text-anchor="middle">checks price, permissions, format</text><polygon class="box" points="512,216 584,180 656,216 584,252"/><text class="ink" x="584" y="220" text-anchor="middle">High risk?</text><rect class="box" x="260.0" y="188" width="160" height="56" rx="8"/><text class="ink b" x="340" y="212" text-anchor="middle">Human approval</text><text class="quiet s" x="340" y="230" text-anchor="middle">refunds, cancellations</text><rect class="box" x="468.0" y="302" width="232" height="56" rx="8"/><text class="ink b" x="584" y="326" text-anchor="middle">Execute</text><text class="quiet s" x="584" y="344" text-anchor="middle">reply, create order, send message</text><rect class="box" x="468.0" y="412" width="232" height="56" rx="8"/><text class="ink b" x="584" y="436" text-anchor="middle">Log and monitor</text><text class="quiet s" x="584" y="454" text-anchor="middle">catch real failures in production</text><text class="quiet s" x="466" y="208" text-anchor="middle">yes</text><text class="quiet s" x="594" y="284" text-anchor="start">no</text><text class="quiet s" x="404" y="322" text-anchor="middle">approved</text><text class="quiet s" x="240" y="300" text-anchor="end">improve prompts and evals</text></svg>