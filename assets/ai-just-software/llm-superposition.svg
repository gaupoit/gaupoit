othing else moves</text><line class="line" x1="552" y1="120" x2="668" y2="104"/><line class="accline" x1="552" y1="120" x2="668" y2="184"/><line class="line" x1="552" y1="120" x2="668" y2="224"/><line class="line" x1="552" y1="168" x2="668" y2="104"/><line class="line" x1="552" y1="168" x2="668" y2="144"/><line class="line" x1="552" y1="168" x2="668" y2="264"/><line class="line" x1="552" y1="216" x2="668" y2="144"/><line class="accline" x1="552" y1="216" x2="668" y2="184"/><line class="accline" x1="552" y1="264" x2="668" y2="184"/><line class="line" x1="552" y1="264" x2="668" y2="224"/><line class="line" x1="552" y1="264" x2="668" y2="264"/><rect class="box" x="416" y="102" width="136" height="36" rx="8"/><text class="ink" x="484" y="124" text-anchor="middle">Oily skin</text><rect class="box" x="416" y="150" width="136" height="36" rx="8"/><text class="ink" x="484" y="172" text-anchor="middle">Lipstick</text><rect class="box" x="416" y="198" width="136" height="36" rx="8"/><text class="ink" x="484" y="220" text-anchor="middle">Annoyed customer</text><rect class="box" x="416" y="246" width="136" height="36" rx="8"/><text class="ink" x="484" y="268" text-anchor="middle">Cheap price</text><circle class="box" cx="680" cy="104" r="12"/><text class="quiet s" x="700" y="108" text-anchor="start">n1</text><circle class="box" cx="680" cy="144" r="12"/><text class="quiet s" x="700" y="148" text-anchor="start">n2</text><circle class="acc" cx="680" cy="184" r="12"/><text class="ink s b" x="700" y="188" text-anchor="start">n3</text><circle class="box" cx="680" cy="224" r="12"/><text class="quiet s" x="700" y="228" text-anchor="start">n4</text><circle class="box" cx="680" cy="264" r="12"/><text class="quiet s" x="700" y="268" text-anchor="start">n5</text><text class="quiet s" x="416" y="316" text-anchor="start">Change n3 and three concepts shift</text></svg>